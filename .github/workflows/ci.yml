name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Überholte Läufe desselben Branches abbrechen — aber nie auf main:
# dort pusht der pin-Job, ein Abbruch mittendrin wäre schlimmer als Wartezeit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: notely_test
          POSTGRES_USER: notely
          POSTGRES_PASSWORD: notely
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notely -d notely_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
        env:
          DATABASE_URL: postgresql+psycopg://notely:notely@localhost:5432/notely_test

  image:
    name: Build & push image (${{ matrix.service }})
    needs: quality
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: notely
            context: .
            suffix: ""
          - service: stats
            context: stats
            suffix: "-stats"

    permissions:
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
          tags: |
            type=sha,format=long
            type=ref,event=pr

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ matrix.service }}:scan
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trivy report (informational)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.service }}:scan
          format: table
          exit-code: 0

      - name: Trivy gate (fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.service }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.service }}:scan
          format: cyclonedx
          output: sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom.cdx.json

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          # arm64 nur, wenn wirklich gepusht wird — im PR wäre die QEMU-Emulation
          # minutenlange Arbeit für ein Image, das niemand verwendet.
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}

  pin:
    name: Pin overlays
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pin the overlays to this image
        run: |
          for f in k8s/overlays/prod/kustomization.yaml k8s/overlays/argocd/kustomization.yaml; do
            sed -i -E "s|^( *newTag: ).*|\1sha-${GITHUB_SHA}|" "$f"
          done
          git --no-pager diff -- k8s/overlays/

      - name: Commit the pinned tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/
          if git diff --cached --quiet; then
            echo "Tag unverändert, nichts zu committen"
          else
            git commit -m "chore(deploy): pin overlays to sha-${GITHUB_SHA} [skip ci]"
            git push origin HEAD:main
          fi