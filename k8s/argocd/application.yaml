apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notely
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/BurhanDevOpsNew/notely-platform.git
    targetRevision: main
    path: k8s/overlays/argocd

  destination:
    server: https://kubernetes.default.svc
    namespace: default