# Tuersteher vor der Datenbank: nur wer Daten BRAUCHT, erreicht Port 5432.
# Alles andere (stats, grafana, ein gekaperter Pod) laeuft ins Leere —
# die Etappe-31-Regel "Services teilen APIs, keine Tabellen" als Netz-Zwang.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: notely
        - podSelector:
            matchLabels:
              app: notely-migrate
        - podSelector:
            matchLabels:
              app: postgres-backup
      ports:
        - port: 5432
