apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../postgres
  - ../../monitoring
  - ../../stats

configMapGenerator:
  - name: notely-config
    literals:
      - APP_VERSION=local-kustomize-2

secretGenerator:
  - name: postgres-credentials
    envs:
      - postgres-credentials.env
  - name: notely-db
    envs:
      - notely-db.env

images:
  - name: notely
    newTag: dev
  - name: notely-stats
    newTag: dev
