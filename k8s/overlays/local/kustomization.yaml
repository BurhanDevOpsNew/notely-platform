apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../postgres

configMapGenerator:
  - name: notely-config
    literals:
      - APP_VERSION=local-kustomize-2

secretGenerator:
  - name: postgres-credentials
    literals:
      - POSTGRES_DB=notely
      - POSTGRES_USER=notely
      - POSTGRES_PASSWORD=nur-lokal-zum-lernen
  - name: notely-db
    literals:
      - DATABASE_URL=postgresql+psycopg://notely:nur-lokal-zum-lernen@postgres:5432/notely

images:
  - name: notely
    newTag: dev

replicas:
  - name: notely
    count: 2