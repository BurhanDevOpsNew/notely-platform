apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../postgres
  - ../../monitoring
  - ../../stats

configMapGenerator:
  - name: notely-config
    literals:
      - APP_VERSION=gitops

generators:
  - secret-generator.yaml

images:
  - name: notely
    newName: ghcr.io/burhandevopsnew/notely-platform
    newTag: sha-5b2f0f76d5cf3c3c37dcce840b792b99b6edf7fb
  - name: notely-stats
    newName: ghcr.io/burhandevopsnew/notely-platform-stats
    newTag: sha-5b2f0f76d5cf3c3c37dcce840b792b99b6edf7fb

replicas:
  - name: notely
    count: 2