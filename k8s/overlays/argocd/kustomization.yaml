apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../postgres
  - ../../monitoring
  - ../../stats

configMapGenerator:
  - name: notely-config
    literals:
      - APP_VERSION=gitops

generators:
  - secret-generator.yaml

images:
  - name: notely
    newName: ghcr.io/burhandevopsnew/notely-platform
    newTag: sha-dd61e3d9dc0fd7b4aff940857e4a301cb6a491ca
  - name: notely-stats
    newName: ghcr.io/burhandevopsnew/notely-platform-stats
    newTag: sha-dd61e3d9dc0fd7b4aff940857e4a301cb6a491ca

replicas:
  - name: notely
    count: 2