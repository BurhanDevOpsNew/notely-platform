apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../postgres
  - ../../monitoring

configMapGenerator:
  - name: notely-config
    literals:
      - APP_VERSION=gitops

images:
  - name: notely
    newName: ghcr.io/burhandevopsnew/notely-platform
    newTag: sha-9fe3aa21d6bed388a7a6ae80a663f572bf961cbf

replicas:
  - name: notely
    count: 2