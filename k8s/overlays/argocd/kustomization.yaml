apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ../../policies
  - ../../postgres
  - ../../monitoring
  - ../../stats
  - ../../logging

configMapGenerator:
  - name: notely-config
    literals:
      - APP_VERSION=gitops

generators:
  - secret-generator.yaml

images:
  - name: notely
    newName: ghcr.io/burhandevopsnew/notely-platform
    newTag: sha-a45fca8d1af0e8c803ff836352a1ab2c05f7c696
  - name: notely-stats
    newName: ghcr.io/burhandevopsnew/notely-platform-stats
    newTag: sha-a45fca8d1af0e8c803ff836352a1ab2c05f7c696
