apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: notely-config
    literals:
      - APP_VERSION=prod

secretGenerator:
  - name: notely-db
    envs:
      - notely-db.env

images:
  - name: notely
    newName: ghcr.io/burhandevopsnew/notely-platform
    newTag: sha-e833b4fede69e5353ba58ccc6f32ad8f2c79597a

replicas:
  - name: notely
    count: 3