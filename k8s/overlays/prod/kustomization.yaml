apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: notely-config
    literals:
      - APP_VERSION=prod

secretGenerator:
  - name: notely-db
    envs:
      - notely-db.env

images:
  - name: notely
    newName: ghcr.io/burhandevopsnew/notely-platform
    newTag: sha-f2fa21641b44590cbb9ef1b2ed86fe6064878567

replicas:
  - name: notely
    count: 3