route:
  receiver: default
  group_by: [alertname, namespace]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: critical
      group_wait: 10s

receivers:
  - name: default
    webhook_configs:
      - url: http://webhook-logger:9000/alerts
        send_resolved: true
  - name: critical
    webhook_configs:
      - url: http://webhook-logger:9000/critical
        send_resolved: true

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [namespace]