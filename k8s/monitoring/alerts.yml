groups:
  - name: notely
    rules:
      # "== 0" erkennt: Target wird gefunden, antwortet aber nicht.
      - alert: NotelyTargetDown
        expr: up{job="kubernetes-pods"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.pod }} liefert keine Metriken mehr"

      # "absent()" erkennt: es gibt überhaupt kein Target mehr.
      - alert: NotelyNoTargets
        expr: absent(up{job="kubernetes-pods"})
        for: 2m
        labels:
          severity: critical
          namespace: default
        annotations:
          summary: "Kein notely-Pod mehr im Scrape-Ziel"

      # sum by (namespace): erhält das Label, damit die inhibit_rule greifen kann.
      - alert: NotelyHighErrorRate
        expr: >-
          sum by (namespace) (rate(http_requests_total{status=~"5.."}[5m]))
          / sum by (namespace) (rate(http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Fehlerrate über 5 Prozent"

      - alert: NotelySlowRequests
        expr: >-
          histogram_quantile(0.95,
            sum by (le, namespace) (rate(http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 über 500 ms"

  - name: argocd
    rules:
      # Statisches Target: die Reihe verschwindet nie aus der Zielliste,
      # "== 0" genügt — anders als bei Service Discovery (vgl. NotelyNoTargets).
      - alert: ArgoCDMetricsDown
        expr: up{job="argocd"} == 0
        for: 5m
        labels:
          severity: warning
          namespace: argocd
        annotations:
          summary: "ArgoCD liefert keine Metriken mehr"

      # Greift auch bei "Unknown" (Rendering kaputt) — der Fall aus der Übung.
      - alert: ArgoCDAppNotSynced
        expr: argocd_app_info{sync_status!="Synced"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Application {{ $labels.name }} ist {{ $labels.sync_status }} statt Synced"