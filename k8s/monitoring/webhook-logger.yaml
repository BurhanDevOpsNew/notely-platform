apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-logger
  labels:
    app: webhook-logger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook-logger
  template:
    metadata:
      labels:
        app: webhook-logger
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: logger
          image: python:3.12-slim
          command: ["python", "-u", "-c"]
          args:
            - |
              # Nimmt Alertmanager-Webhooks an, schreibt jeden als eine JSON-Logzeile.
              import http.server, json
              class H(http.server.BaseHTTPRequestHandler):
                  def do_POST(self):
                      body = self.rfile.read(int(self.headers["Content-Length"]))
                      print(json.dumps(json.loads(body)), flush=True)
                      self.send_response(200)
                      self.end_headers()
                  def log_message(self, *args):
                      pass
              http.server.HTTPServer(("", 9000), H).serve_forever()
          ports:
            - containerPort: 9000
              name: http
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-logger
spec:
  selector:
    app: webhook-logger
  ports:
    - port: 9000
      targetPort: http
